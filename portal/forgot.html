<!DOCTYPE html>
<html lang="zh-HK" class="no-js">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.replace("no-js", "js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>重設登入 | 3Business 企業客戶平台</title>
  <link rel="icon" href="../images-new/3business.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css-new/newmain.css">
  <link rel="stylesheet" href="../css-new/portal-auth.css">
</head>
<body class="portal-auth">
  <header class="portal-header site-header">
    <div class="wrap util-bar">
      <a class="back-link" href="login.html">← 返回登入</a>
      <a class="lang" href="forgot-en.html" hreflang="en-HK">English</a>
    </div>
    <div class="wrap head">
      <a class="logo" href="../index.html"><img src="../images-new/3business.png" alt="3Business"></a>
    </div>
  </header>
  <main id="main" class="portal-main">
    <div class="auth-layout auth-layout--solo">
      <div class="auth-card">
        <div class="auth-card-accent" aria-hidden="true"></div>
        <div class="auth-card-body">
          <h1>重設密碼或登入權限</h1>
          <p class="lede">概念流程 — 登入資料由客戶服務經理（ASM）管理。自助重設須視乎日後保安政策而定。</p>
          <ol class="step-list" id="first-time">
            <li>確認公司已登記使用企業客戶平台。</li>
            <li>透過電郵或電話聯絡 ASM，並提供公司名稱及聯絡人。</li>
            <li>按歡迎訊息指示設定新密碼。</li>
          </ol>
          <p class="auth-help-body">銷售 <a href="tel:+85221286886">2128 6886</a> · 客戶服務 <a href="tel:+8521039">1039</a></p>
          <a class="btn btn-primary" href="login.html">返回登入</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
