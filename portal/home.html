<!DOCTYPE html>
<html lang="zh-HK" class="no-js">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.replace("no-js", "js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>我的戶口 | 3Business 企業客戶平台</title>
  <link rel="icon" href="../images-new/3business.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css-new/newmain.css">
  <link rel="stylesheet" href="../css-new/portal-auth.css">
</head>
<body id="top" class="portal-auth portal-hub">
  <a class="skip" href="#main">跳至主要內容</a>

  <header class="portal-header site-header">
    <div class="wrap util-bar">
      <a class="back-link" href="../index.html">3Business 主頁</a>
      <div class="util-actions">
        <a class="lang" href="home-en.html" hreflang="en-HK" lang="en-HK">English</a>
        <a class="btn btn-ghost sign-out-btn" href="login.html">登出</a>
      </div>
    </div>
    <div class="wrap head">
      <a class="logo" href="../index.html" aria-label="3Business 主頁">
        <img src="../images-new/3business.png" alt="3Business">
      </a>
    </div>
  </header>

  <main id="main" class="portal-main">
    <div class="hub-wrap">
      <div class="hub-alert" role="status">
        系統維護：星期六凌晨 2:00–4:00 — 部分報告可能暫停。
      </div>

      <div class="hub-top">
        <div>
          <h1>歡迎回來</h1>
          <p class="hub-greeting">宏創實業有限公司 · 已登入 <span class="grad">企業客戶平台</span></p>
        </div>
      </div>

      <div class="hub-grid" aria-label="快捷功能">
        <a class="hub-card hub-card--billing hub-card--featured" href="#">
          <span class="hub-tag">賬單</span>
          <div class="hub-card-head">
            <span class="hub-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v14H4z"/><path d="M8 11h8M8 15h5"/></svg>
            </span>
            <h2>繳付賬單</h2>
          </div>
          <p>查閱結欠及下載最新發票。</p>
        </a>
        <a class="hub-card hub-card--usage" href="#">
          <span class="hub-tag">用量</span>
          <div class="hub-card-head">
            <span class="hub-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>
            </span>
            <h2>查閱用量</h2>
          </div>
          <p>檢視流動數據、通話及短訊用量。</p>
        </a>
        <a class="hub-card hub-card--services" href="#">
          <span class="hub-tag">服務</span>
          <div class="hub-card-head">
            <span class="hub-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>
            </span>
            <h2>管理服務</h2>
          </div>
          <p>檢視生效計劃及服務申請。</p>
        </a>
        <a class="hub-card hub-card--documents" href="#">
          <span class="hub-tag">文件</span>
          <div class="hub-card-head">
            <span class="hub-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8l4 4v12H8z"/><path d="M16 4v4h4"/></svg>
            </span>
            <h2>文件</h2>
          </div>
          <p>合約、稅務發票及戶口信件。</p>
        </a>
        <a class="hub-card hub-card--support" href="../contactus.html">
          <span class="hub-tag">支援</span>
          <div class="hub-card-head">
            <span class="hub-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v10H8l-4 4z"/></svg>
            </span>
            <h2>尋求支援</h2>
          </div>
          <p>聯絡客戶服務經理或企業熱線。</p>
        </a>
        <article class="hub-card hub-card--settings is-disabled" aria-disabled="true">
          <span class="hub-tag">設定</span>
          <div class="hub-card-head">
            <span class="hub-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
            <h2>戶口設定</h2>
          </div>
          <p>即將推出 — 用戶及權限管理。</p>
        </article>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="wrap portal-footer-inner">
      <p class="brand-note">© 3Business · 和記電訊香港</p>
      <ul class="foot-mini-links">
        <li><a href="login.html">登出</a></li>
        <li><a href="../index.html">3Business 主頁</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
